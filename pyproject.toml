[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-voice2text"
version = "0.1.0"
description = "Local speech-to-text: ffmpeg to 16 kHz mono WAV, then faster-whisper."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "BobbyChew"}]
keywords = ["speech-to-text", "whisper", "ffmpeg", "cli"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
local-voice2text = "local_voice2text.cli:cli_main"

[project.urls]
Homepage = "https://github.com/BobbyChew/local-voice2text"

[tool.setuptools.packages.find]
where = ["."]
include = ["local_voice2text*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
